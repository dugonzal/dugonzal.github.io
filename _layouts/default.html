<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != "Inicio" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>

<header class="site">
  <a class="brand" href="{{ '/' | relative_url }}">
    {%- if page.url == '/' -%}
    <h1 class="name">{{ site.title }}</h1>
    {%- else -%}
    <span class="name">{{ site.title }}</span>
    {%- endif -%}
    <span class="tagline">{{ site.tagline }}</span>
  </a>
  <nav>
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Inicio</a>
    <a href="{{ '/cv/' | relative_url }}"{% if page.url contains '/cv' %} class="active"{% endif %}>CV</a>
    <a href="{{ '/pruebas/' | relative_url }}"{% if page.url contains '/pruebas' %} class="active"{% endif %}>Pruebas</a>
    <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} class="active"{% endif %}>Blog</a>
  </nav>
</header>

<main>
{{ content }}
</main>

<footer class="site">
  <p>
    <a href="mailto:{{ site.email }}">{{ site.email }}</a> ·
    <a href="https://github.com/{{ site.github_username }}">github.com/{{ site.github_username }}</a>
  </p>
  <p class="muted">{{ site.location }}</p>
</footer>

</body>
</html>
